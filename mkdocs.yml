site_name: ECG Lab Book
site_description: Internal handbook for the Embodied Computation Group
site_url: ""

# Book content lives in docs/. Every internal link is relative (pages/05-the-loop.md,
# ../index.md), so the same links work in this rendered site AND when browsing the raw
# .md files on GitHub. Keep it that way: no absolute paths, no site-only link syntax.
docs_dir: docs
site_dir: site

use_directory_urls: true

# MkDocs excludes /templates/ by default (it assumes Jinja templates). Ours are
# copyable starter files and must be published, so override the default.
exclude_docs: |
  .*
  /site/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer      # prev/next at the bottom of every page
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/embodied-computation-group/lab-book
repo_name: embodied-computation-group/lab-book
edit_uri: edit/main/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting going:
      - 1. Start here: pages/01-start-here.md
      - 2. Setup: pages/02-setup.md
      - 3. Project layout: pages/03-project-layout.md
      - 4. Writing a CLAUDE.md: pages/04-claude-md.md
  - Doing the work:
      - 5. The loop: pages/05-the-loop.md
      - 6. Verification: pages/06-verification.md
      - 7. Reproducibility: pages/07-reproducibility.md
      - 8. Notebooks and figures: pages/08-notebooks-and-figures.md
  - Lab specifics:
      - 9. Cluster work: pages/09-hpc.md
      - 10. The genomedk skill: pages/10-genomedk-skill.md
      - 11. Human-subject data: pages/11-data-and-ethics.md
      - 12. Tips and tricks: pages/12-tips-and-tricks.md
  - Reference:
      - 13. Resources: pages/13-resources.md
      - 14. Contributing: pages/14-contributing.md
  - Templates:
      - Project tree: starters/project-tree.md
      - CLAUDE.md: starters/CLAUDE.md
      - Verification checklist: starters/verification-checklist.md

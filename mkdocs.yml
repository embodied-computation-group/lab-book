site_name: Agents in the Lab
site_description: A practical introduction to scientific AI agents for PhD students
site_url: https://www.the-ecg.org/lab-book/

# Book content lives in docs/. Every internal link is relative (pages/06-the-loop.md,
# ../index.md), so the same links work in this rendered site AND when browsing the raw
# .md files on GitHub. Keep it that way: no absolute paths, no site-only link syntax.
docs_dir: docs
site_dir: site

use_directory_urls: true

# MkDocs excludes /templates/ by default (it assumes Jinja templates). Ours are
# copyable starter files and must be published, so override the default.
exclude_docs: |
  .*
  /site/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer      # prev/next at the bottom of every page
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/embodied-computation-group/lab-book
repo_name: embodied-computation-group/lab-book
edit_uri: edit/main/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Start and try:
      - Start here: pages/01-start-here.md
      - Setup: pages/03-setup.md
      - "Lab tutorial: import to analysis": pages/lab-data-tutorial.md
      - "Quick warm-up: a fictional CSV": pages/first-exercise.md
  - Everyday workflow:
      - Working with context: pages/02-context.md
      - Project layout and Git: pages/04-project-layout.md
      - Writing a CLAUDE.md: pages/05-claude-md.md
      - Running the loop: pages/06-the-loop.md
      - Practical tips: pages/14-tips-and-tricks.md
  - Results you can rely on:
      - Verification: pages/07-verification.md
      - Reproducibility: pages/08-reproducibility.md
      - Notebooks and figures: pages/09-notebooks-and-figures.md
      - Human-subject data: pages/13-data-and-ethics.md
  - Optional extensions:
      - Skills: pages/10-skills.md
      - Cluster work: pages/11-hpc.md
      - The genomedk skill: pages/12-genomedk-skill.md
  - Reference:
      - Resources: pages/15-resources.md
      - Contributing: pages/16-contributing.md
  - Templates:
      - Project tree: starters/project-tree.md
      - CLAUDE.md: starters/CLAUDE.md
      - Model context example: starters/rescorla-wagner-spec.md
      - Verification checklist: starters/verification-checklist.md
